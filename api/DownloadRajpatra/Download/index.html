<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading Rajpatra PDF...</title>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #ffffff;">

    <h2>Downloading Gazette PDF... Please wait.</h2>

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const batchNo = urlParams.get('batchNo');

            if (batchNo) {
                // PDF source path from your repository
                const pdfUrl = `https://mahaaappverification.github.io/mahaonline.gov.in/Pdfs/${batchNo}.pdf`;

                // Create download link with file named "DisplayRajpatra.pdf"
                const link = document.createElement('a');
                link.href = pdfUrl;
                link.setAttribute('download', 'DisplayRajpatra.pdf');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else {
                document.body.innerHTML = "<h3>Error: No Batch Number provided in link.</h3>";
            }
        })();
    </script>

</body>
</html>
