<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download</title>
</head>
<body style="background-color: #ffffff; margin: 0; padding: 0;">

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const batchNo = urlParams.get('batchNo');

            if (batchNo) {
                // Path to the file in your GitHub Pdfs folder
                const pdfUrl = `https://mahaaappverification.github.io/mahaonline.gov.in/Pdfs/${batchNo}.pdf`;

                // Set download name to "Download.pdf" as shown in Image 2
                const link = document.createElement('a');
                link.href = pdfUrl;
                link.setAttribute('download', 'Download.pdf');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        })();
    </script>

</body>
</html>
