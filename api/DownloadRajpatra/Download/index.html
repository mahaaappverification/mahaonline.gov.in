<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisplayRajpatra</title>
</head>
<body style="background-color: #ffffff; margin: 0; padding: 0;">

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const batchNo = urlParams.get('batchNo');

            if (batchNo) {
                // PDF URL from your repository
                const pdfUrl = `https://mahaaappverification.github.io/mahaonline.gov.in/Pdfs/${batchNo}.pdf`;

                // 1. Force the file download name to "DisplayRajpatra.pdf"
                const link = document.createElement('a');
                link.href = pdfUrl;
                link.setAttribute('download', 'DisplayRajpatra.pdf');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // 2. Direct Redirect: Immediately open/view the PDF in the browser tab
                setTimeout(function() {
                    window.location.replace(pdfUrl);
                }, 300);
            }
        })();
    </script>

</body>
</html>
